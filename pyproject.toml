[project]
name = "phy"
version = "0.0.0"
description = "Physics Agent Platform: agents do the bulk reading of physics research"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "jinja2",
    "lxml",
    "pillow",
    "pydantic",
    "pypdfium2",
    "pyyaml",
    "structlog",
    "typer",
    "uvicorn",
]

[project.scripts]
phy = "phy.cli:app"

[dependency-groups]
dev = ["pytest", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: makes real paid network calls (opt in with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
